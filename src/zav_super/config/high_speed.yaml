fsm:
  click_goal_en: true
  click_goal_topic: /planning/click_goal
  click_height: 1.5
  click_yaw_en: true
  replan_rate: 15.0
  cmd_topic: /planning/pos_cmd
  mpc_cmd_topic: /planning_cmd/poly_traj
  timer_en: true
super_planner:
  backup_traj_en: true
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: false
  goal_vel_en: false
  corridor_bound_dis: 3
  corridor_line_max_length: 3
  safe_corridor_line_max_length: 999
  iris_iter_num: 2
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 30.0
  sensing_horizon: -1
  receding_dis: 15.0
  robot_r: 0.33
  yaw_dot_max: 0.8
  yaw_mode: 1
  mpc_horizon: 15
traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false
  boundary:
    max_vel: 10
    max_acc: 2.0
    max_jerk: 8.0
    max_omg: 1.2
    max_acc_thr: 20
    min_acc_thr: 6.0
    penna_margin: 0.05
  exp_traj:
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-06
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 1000000.0
    penna_pos: 500000000.0
    penna_vel: 500000000.0
    penna_acc: 500000000.0
    penna_jerk: 500000000000.0
    penna_attract: 10000000.0
    penna_omg: 500000000.0
    penna_thr: 500000000.0
  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-06
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1000000.0
    penna_ts: 10000000.0
    penna_pos: 10000000000.0
    penna_vel: 100000000.0
    penna_acc: 100000000.0
    penna_jerk: 100000000.0
    penna_omg: 500000000.0
    penna_thr: 500000000.0
  flatness:
    mass: 1.99
    dh: 0.4
    dv: 0.0
    cp: 0.0
    v_eps: 0.0001
    grav: 9.81
astar:
  map_voxel_num:
  - 500
  - 500
  - 100
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false
rog_map:
  resolution: 0.15
  inflation_resolution: 0.15
  inflation_step: 3
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size:
  - 15
  - 110
  - 6
  fix_map_origin:
  - 0
  - 0
  - 1.5
  frontier_extraction_en: false
  virtual_ceil_height: 5
  virtual_ground_height: -0.15
  load_pcd_en: false
  map_sliding:
    enable: false
    threshold: 1.0
  esdf:
    enable: false
    resolution: 0.1
    local_update_box:
    - 5
    - 5
    - 3
  ros_callback:
    enable: true
    cloud_topic: /zav/super/cloud_world
    odom_topic: /zav/super/odom
    odom_timeout: 0.5
  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range:
    - 30
    - 30
    - 6
    frame_id: world
    pub_unknown_map_en: false
  intensity_thresh: -10
  point_filt_num: 1
  raycasting:
    enable: true
    batch_update_size: 1
    local_update_box:
    - 35
    - 35
    - 6
    ray_range:
    - 0.5
    - 70.0
    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0
